gpu_lst: [1,2,3]
thread_per_gpu: 1 # use 1 thread per GPU to avoid CUDA/OpenGL context corruption in multi-processing rendering

max_point_num: 4096
pc_per_scene: 4
views_per_pc: 3
fused_render_strategy: all_at_once # per_pc renders 3 views four times; all_at_once renders all 12 views in one tiled pass

save_path: ${data.output_vision_template}
save_pc: True
save_rgb: False
save_depth: False
save_individual_views: False
point_cloud_outputs:
  - name: random4096
    sample_method: random
    save_path: ${data.root}/vision_data/three_realsense_d435_random4096/**
  - name: fps4096
    enabled: False
    sample_method: fps
    fps_backend: pytorch3d
    save_path: ${data.root}/vision_data/three_realsense_d435_fps4096/**
    fps_pre_sample_num: 65536

renderer:
  tile_width: 1280
  tile_height: 720
  z_near: 0.1
  z_far: 10.0
  n_cols: 2
  n_rows: 2
  camera_model:
    type: custom
    # Intel RealSense D435I color 1280x720 intrinsics for aligned depth to color.
    fx: 910.944763183594
    fy: 910.721984863281
    cx: 642.13818359375
    cy: 367.6796875

camera:
  floating:
    type: spherical
    radius: 1.0
    pos_noise: 0.1
    lookat_noise: 0.1
  tabletop_ur10e:
    type: circular_zaxis_uniform_group
    radius: 0.8
    height: 0.8
    center_xy: [0.0, 0.0]
    start_angle: 0.0
    global_yaw_mode: uniform # random, uniform, golden_angle, or fixed
    random_start_angle: True
    up: [0, 0, 1.0]
    pos_noise: 0.1
    lookat: [0.0, 0, 0]
    lookat_noise: 0.1
    up_noise: 0.2
    fuse_pc: True
